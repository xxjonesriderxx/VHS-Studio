name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Release date: YYYY-MM-DD, optionally followed by -BUILD'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Set date-based release version
        env:
          RELEASE_DATE: ${{ inputs.release_date || github.ref_name }}
        run: |
          python -c "import os,json; from pathlib import Path; from app_updates import version_key; v=os.environ['RELEASE_DATE']; version_key(v); Path('app_version.py').write_text('VERSION='+repr(v)+'\nREPOSITORY='+repr('xxjonesriderxx/VHS-Studio')+'\n',encoding='utf8'); p=Path('bootstrap-lock.json'); lock=json.loads(p.read_text('utf8')); lock['version']=v; p.write_text(json.dumps(lock,indent=2)+'\n',encoding='utf8')"
      - name: Check repository contents and security boundaries
        run: python -m unittest test_repository test_security
      - name: Build source-only launcher
        run: python build_bootstrap.py
      - name: Verify date-version updater
        run: python test_updates.py
      - name: Prepare reviewed download-based assets
        run: python package_bootstrap.py
      - name: Upload draft for final artifact review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ inputs.release_date || github.ref_name }}
        shell: pwsh
        run: |
          $notes = 'Windows x64 preview. Both downloads obtain runtime and components directly from original upstream providers. Internet is required on first use. No prefilled offline bundle. OpenProteus has a separate noncommercial model license.'
          gh release view $env:RELEASE_DATE *> $null
          if ($LASTEXITCODE -eq 0) {
            $draft = gh release view $env:RELEASE_DATE --json isDraft --jq '.isDraft'
            if ($draft -ne 'true') { throw 'Existing public releases must not be overwritten by a draft build.' }
          } else { gh release create $env:RELEASE_DATE --draft --title "VHS Studio v$env:RELEASE_DATE" --notes $notes --target $env:GITHUB_SHA }
          gh release upload $env:RELEASE_DATE "bootstrap-dist/VHS-Studio-$env:RELEASE_DATE.exe" "bootstrap-dist/VHS-Studio-$env:RELEASE_DATE-portable.zip" --clobber
