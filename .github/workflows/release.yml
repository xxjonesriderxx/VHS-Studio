name: Build Windows release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*'
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Release date: YYYY-MM-DD, optionally followed by -BUILD'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Set date-based release version
        env:
          RELEASE_DATE: ${{ inputs.release_date || github.ref_name }}
        run: |
          python -c "import os; from pathlib import Path; from app_updates import version_key; v=os.environ['RELEASE_DATE']; version_key(v); Path('app_version.py').write_text('VERSION='+repr(v)+'\nREPOSITORY='+repr('xxjonesriderxx/VHS-Studio')+'\n',encoding='utf8')"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone EXE and offline ZIP
        run: python build_release.py
      - name: Verify date-version updater
        run: python test_updates.py
      - name: Publish exactly two application assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ inputs.release_date || github.ref_name }}
        shell: pwsh
        run: |
          $notes = 'Windows x64 preview: standalone EXE with verified upstream downloads, and complete offline portable ZIP. AI-assisted / vibe-coded; inspect results. OpenProteus has its own noncommercial model license. See README and included notices.'
          gh release view $env:RELEASE_DATE *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_DATE --title "VHS Studio $env:RELEASE_DATE" --notes $notes --target $env:GITHUB_SHA }
          gh release upload $env:RELEASE_DATE "dist/VHS-Studio-$env:RELEASE_DATE.exe" "dist/VHS-Studio-$env:RELEASE_DATE-portable.zip" --clobber
