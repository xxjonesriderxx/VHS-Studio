name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source contents and security boundaries
        run: python -m unittest test_repository test_security
      - name: Check update verification and rollback
        run: python test_updates.py
